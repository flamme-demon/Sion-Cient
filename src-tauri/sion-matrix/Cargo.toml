[package]
name = "sion-matrix"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Cœur Matrix de Sion (matrix-rust-sdk), indépendant de l'interface"
publish = false

[dependencies]
matrix-sdk = { version = "=0.19.1", features = ["bundled-sqlite"] }
tokio = { version = "1", features = ["sync", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
thiserror = "2"
getrandom = "0.3"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
