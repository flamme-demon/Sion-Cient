name: CI

# Non-regression gate: runs on every push/PR to main. The JS job is the fast
# path (~2 min): typecheck + vitest unit tests. The Rust job compiles the
# crate in debug (webrtc-based voice makes it heavy — cargo cache keeps
# re-runs fast) and runs the unit tests.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-js:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        # `tsc -b` (build mode), NOT `tsc --noEmit`: the root tsconfig is a
        # solution file (references only), so --noEmit against it checks
        # nothing. Both referenced projects set noEmit → -b is a pure
        # typecheck of src/ (app) + vite.config.ts (node), tests included.
        run: bunx tsc -b

      - name: Lint
        run: bun run lint

      - name: Unit tests (vitest)
        run: bun run test

  test-rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        # WRY (WebKitGTK) + audio native + fenêtre overlay (winit X11/Wayland).
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config curl wget file zstd squashfs-tools \
            libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev libsoup-3.0-dev \
            librsvg2-dev libglib2.0-dev \
            libasound2-dev libudev-dev libpulse-dev libxcb1-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libwayland-dev

      - name: Install clang 21 (libc++ hermétique de libwebrtc)
        # Le webrtc-sys vendored exige clang >= 21 : le libc++ hermétique
        # embarqué dans libwebrtc.a utilise des builtins récents. Ubuntu 24.04
        # n'a que clang 18 → dépôt LLVM officiel.
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-21.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y clang-21

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 'stable'
          targets: x86_64-unknown-linux-gnu

      - name: Cache cargo registry + build artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          # Distinct key from the release workflow (debug vs release profile).
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-test-

      - name: Rust unit tests
        working-directory: src-tauri
        run: cargo test -j4
        env:
          CC: clang-21
          CXX: clang++-21
