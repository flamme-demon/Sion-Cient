name: Release

# Triggered when we push a `v*` tag (e.g. `v1.1.0`). Builds Linux AppImage
# and Windows NSIS installer (.exe) in parallel, then publishes a GitHub Release with both
# artifacts attached. The version string is derived from the tag itself
# so we don't have to keep the workflow in sync with package.json.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.1.0). For dry runs.'
        required: false
        default: ''

permissions:
  contents: write   # needed to create a GitHub Release

jobs:
  # -------------------------------------------------------------------------
  # Linux AppImage. Uses the existing build-scripts/build-appimage.sh which
  # downloads linuxdeploy on demand, so the workflow only has to install
  # bun + rust + the WRY/WebKitGTK and audio system libs.
  # -------------------------------------------------------------------------
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # WRY s'appuie sur WebKitGTK au runtime : les paquets -dev sont donc
          # requis par les build scripts glib/gtk/soup. Plus l'audio
          # (alsa/pulse), la fenêtre overlay (xcb/wayland) et l'outillage
          # AppImage (zstd, fuse2).
          sudo apt-get install -y \
            build-essential pkg-config curl wget file zstd squashfs-tools \
            libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libglib2.0-dev \
            libasound2-dev libudev-dev libpulse-dev libxcb1-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libwayland-dev \
            libnss3 libgbm1 libxss1 libasound2t64 libxshmfence1 \
            libdrm2 libxcomposite1 libxdamage1 libxfixes3 libxkbcommon0 \
            libpango-1.0-0 libcairo2 libatk-bridge2.0-0 libatk1.0-0 \
            libgtk-3-0t64 libfuse2t64

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'

      - name: Install clang 21 (libc++ hermétique de libwebrtc)
        # Le webrtc-sys vendored exige clang >= 21 : le libc++ hermétique
        # embarqué dans libwebrtc.a utilise des builtins récents. Ubuntu 24.04
        # n'a que clang 18 → dépôt LLVM officiel.
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-21.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y clang-21

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Le dépôt tauri épinglé (git rev) contient tauri-cli qui exige
          # edition 2024 (Rust ≥ 1.85) : Cargo parse tous les membres du
          # workspace de la dépendance git, donc un toolchain récent est requis.
          toolchain: 'stable'
          targets: x86_64-unknown-linux-gnu

      - name: Cache cargo registry + build artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          # Cargo.lock pinpoints the exact dependency graph; bust the cache
          # when it changes so we don't keep stale build outputs around.
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Build AppImage
        run: ./build-scripts/build-appimage.sh
        env:
          # Baked into the JS bundle by Vite (GIF search — Klipy).
          VITE_KLIPY_API_KEY: ${{ secrets.KLIPY_API_KEY }}
          # webrtc-sys vendored : libc++ hermétique → clang >= 21.
          CC: clang-21
          CXX: clang++-21

      - name: Upload AppImage as artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-appimage
          path: dist-appimage/*.AppImage
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # Windows NSIS installer (.exe). We invoke `tauri build --bundles nsis`
  # directly instead of the PowerShell helper script — the helper does
  # dev-machine setup that's unnecessary on a fresh GHA runner.
  # -------------------------------------------------------------------------
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 'stable'
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry + build artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      # CRT/BLAS build knobs for the transcribe.cpp dep live in
      # src-tauri/.cargo/config.toml (committed), so local and CI builds agree.
      - name: Compile Rust binary
        # We do `cargo build` first instead of going straight to
        # `tauri build`, because we need the native DLLs (ggml/transcribe)
        # that build.rs drops next to the binary before staging them into
        # the bundle.
        working-directory: src-tauri
        run: cargo build --release

      - name: Stage native DLLs + patch tauri.conf.json
        # `tauri build --bundles nsis` ne connait pas les DLL natives.
        # On les copie dans src-tauri/native-dist/, puis on injecte un
        # `bundle.resources` dans tauri.conf.json. La config d'origine est
        # sauvegardee puis restauree apres le build.
        shell: pwsh
        run: |
          $nativeDist = "src-tauri/native-dist"
          if (Test-Path $nativeDist) { Remove-Item -Recurse -Force $nativeDist }
          New-Item -ItemType Directory -Force -Path $nativeDist | Out-Null

          # Variantes CPU de ggml + moteur transcribe. Elles sont liees
          # dynamiquement pour que ggml choisisse son noyau selon le processeur
          # de l'utilisateur ; un lien statique embarquerait le jeu
          # d'instructions du RUNNER (AVX-512) et planterait en SIGILL ailleurs.
          # build.rs les depose a cote du binaire, mais le bundler ne les
          # connait pas : sans cette etape l'application ne demarre pas du tout
          # (« transcribe.dll est introuvable »). Le glob native-dist/*.dll
          # ci-dessous les embarque ensuite sans carte supplementaire.
          $staged = @()
          foreach ($pattern in @("ggml*.dll", "libggml*.dll", "transcribe*.dll", "libtranscribe*.dll")) {
            Get-ChildItem -Path "src-tauri/target/release" -Filter $pattern -File -ErrorAction SilentlyContinue | ForEach-Object {
              Copy-Item $_.FullName "$nativeDist/" -Force
              $staged += $_.Name
            }
          }
          # Noms journalises, pas seulement leur nombre : c'est la seule trace
          # consultable apres coup pour savoir ce que l'installeur embarquait.
          Write-Host "DLL ggml/transcribe staged ($($staged.Count)) : $($staged -join ', ')"
          # Compter les fichiers ne suffit pas. Les variantes ggml sont
          # nombreuses et transcribe.dll unique : un lot ampute d'elle seule
          # passait la garde tout en reproduisant exactement la panne signalee
          # en 1.6.2 (« transcribe.dll est introuvable »). On exige donc chaque
          # famille separement.
          $hasEngine = @($staged | Where-Object { $_ -like "transcribe*.dll" -or $_ -like "libtranscribe*.dll" }).Count
          # Les variantes CPU comptent a part. `ggml*.dll` est satisfait par les
          # seules ggml-base.dll et ggml.dll, liees a l'edition des liens et donc
          # toujours la ; les ggml-cpu-*.dll, elles, sont chargees a l'execution
          # et leur absence ne se voit qu'au demarrage du moteur — c'est le
          # « backend error (status 8) » de la 1.6.2, pas une erreur de chargement.
          $hasCpu = @($staged | Where-Object { $_ -like "ggml-cpu-*.dll" -or $_ -like "libggml-cpu-*.dll" }).Count
          $hasGgml = @($staged | Where-Object { $_ -like "ggml*.dll" -or $_ -like "libggml*.dll" }).Count
          if ($hasEngine -eq 0 -or $hasGgml -eq 0 -or $hasCpu -eq 0) {
            Write-Error "DLL manquantes (transcribe: $hasEngine, ggml: $hasGgml, variantes CPU: $hasCpu) — la transcription ne demarrerait pas"
            exit 1
          }
          Write-Host "Controle OK — transcribe: $hasEngine, ggml: $hasGgml, variantes CPU: $hasCpu"

          Copy-Item "src-tauri/tauri.conf.json" "src-tauri/tauri.conf.json.bak"
          $conf = Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          $conf.bundle | Add-Member -NotePropertyName "resources" -NotePropertyValue @{
            "native-dist/*.dll" = "./"
          } -Force
          [System.IO.File]::WriteAllText("$PWD/src-tauri/tauri.conf.json", ($conf | ConvertTo-Json -Depth 10), [System.Text.UTF8Encoding]::new($false))

      - name: Build Tauri NSIS installer (.exe)
        # `bun run tauri` uses @tauri-apps/cli (already in devDependencies)
        # so we don't have to recompile tauri-cli from source. NSIS is
        # downloaded automatically on first invocation.
        run: bun run tauri build --bundles nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ''
          # Baked into the JS bundle by Vite (GIF search — Klipy).
          VITE_KLIPY_API_KEY: ${{ secrets.KLIPY_API_KEY }}

      - name: Restore tauri.conf.json
        # Always run, even on previous-step failure, so a re-run starts
        # from a clean config.
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "src-tauri/tauri.conf.json.bak") {
            Move-Item -Force "src-tauri/tauri.conf.json.bak" "src-tauri/tauri.conf.json"
          }

      - name: Upload NSIS installer as artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # Aggregate the per-OS artifacts into a single GitHub Release. Body is
  # generated from commits since the previous tag; users can edit the
  # release post-publish to add a curated changelog.
  # -------------------------------------------------------------------------
  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # need history to compute "since previous tag"

      - name: Download Linux artifact
        uses: actions/download-artifact@v8
        with:
          name: linux-appimage
          path: ./artifacts

      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: windows-nsis
          path: ./artifacts

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # Hyphenated tags (v1.5.0-beta.1, v2.0.0-rc.1…) publish as
          # pre-releases: excluded from /releases/latest, so the in-app
          # update banner (updateService.ts) never offers a beta to everyone.
          PRERELEASE=""
          case "$TAG" in *-*) PRERELEASE="--prerelease" ;; esac
          # Auto-generate notes from commit history since previous tag.
          # `gh release create --generate-notes` does this server-side.
          gh release create "$TAG" \
            --title "Sion Client $TAG" \
            --generate-notes \
            $PRERELEASE \
            ./artifacts/*.AppImage \
            ./artifacts/*.exe
