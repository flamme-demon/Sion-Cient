name: Build audio.cpp

# Produit le moteur des voix générées pour Linux et macOS.
#
# audio.cpp ne publie des binaires que pour Windows ; sur les autres
# plateformes il faut compiler. Ce workflow le fait une fois pour toutes et
# attache le résultat à une release Sion, d'où `download_tts_engine` peut le
# récupérer comme il récupère llama-cli.
#
# Déclenché à la main : le moteur ne bouge qu'au rythme des mises à jour
# d'audio.cpp, pas à celui de Sion. Épingler un tag connu bon plutôt que de
# suivre main — le projet est très actif et un commit de la veille n'a été
# testé par personne.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag ou commit d'audio.cpp à compiler"
        required: true
        default: release-0.4.2
      release_tag:
        description: "Release Sion dédiée où attacher les binaires (vide = artefacts seulement)"
        required: false
        default: audiocpp-0.4.2

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64-vulkan
            os: ubuntu-24.04
            cmake_flags: -DENGINE_ENABLE_VULKAN=ON
          - name: macos-arm64-metal
            os: macos-14
            # AppleClang ne livre pas OpenMP ; CMake ne trouve libomp que si on
            # lui passe les chemins de Homebrew à la main.
            cmake_flags: >-
              -DENGINE_ENABLE_METAL=ON
              -DOpenMP_C_FLAGS=-Xclang\ -fopenmp\ -I/opt/homebrew/opt/libomp/include
              -DOpenMP_C_LIB_NAMES=omp
              -DOpenMP_CXX_FLAGS=-Xclang\ -fopenmp\ -I/opt/homebrew/opt/libomp/include
              -DOpenMP_CXX_LIB_NAMES=omp
              -DOpenMP_omp_LIBRARY=/opt/homebrew/opt/libomp/lib/libomp.dylib

    steps:
      - name: Checkout audio.cpp
        uses: actions/checkout@v6
        with:
          repository: 0xShug0/audio.cpp
          ref: ${{ inputs.ref }}

      # spirv-headers fournit <spirv/unified1/spirv.hpp>, inclus par
      # ggml-vulkan.cpp. Sans lui la compilation s'arrête net — c'est le piège
      # à ne pas découvrir au moment du packaging.
      - name: Dépendances Vulkan (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build spirv-headers glslc libvulkan-dev

      - name: Dépendances (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja libomp

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_flags }}

      - name: Build
        run: cmake --build build -j4

      # model_specs/ accompagne obligatoirement le binaire : les modèles
      # safetensors (Chatterbox, Qwen3) ne démarrent pas sans, seuls les GGUF
      # embarquent leur spec. Il est placé à côté du binaire, disposition que
      # `model_specs_dir` (tts.rs) sait retrouver.
      # ggml et onnxruntime sont liés statiquement (le CMake ne produit que des
      # .a) : le binaire de ~76 Mo se suffit à lui-même, rien à copier à côté.
      - name: Assembler l'archive
        run: |
          mkdir -p dist/audiocpp
          cp build/bin/audiocpp_cli dist/audiocpp/
          cp -r model_specs dist/audiocpp/
          # Apache-2.0 : la licence doit accompagner toute redistribution du binaire.
          cp LICENSE dist/audiocpp/
          tar -czf audiocpp-${{ matrix.name }}.tar.gz -C dist audiocpp

      - name: Vérifier que le binaire démarre
        run: ./dist/audiocpp/audiocpp_cli --help | head -5

      - uses: actions/upload-artifact@v4
        with:
          name: audiocpp-${{ matrix.name }}
          path: audiocpp-${{ matrix.name }}.tar.gz

      - name: Attacher à la release
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # `-R` est indispensable : le dossier courant est un checkout d'audio.cpp,
        # donc gh y déduirait le dépôt et chercherait la release chez l'amont.
        run: gh release upload "${{ inputs.release_tag }}" "audiocpp-${{ matrix.name }}.tar.gz" --clobber -R ${{ github.repository }}
